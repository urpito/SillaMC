<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>SillaMC — Fuente para stream</title>
  <style>
    *{box-sizing:border-box}html,body{margin:0;background:transparent;overflow:hidden;font-family:Inter,system-ui,sans-serif;color:#fff}
    /* Ancho fijo a proposito: el streamer coloca esto una vez en OBS y no puede
       estar reajustando el hueco cada vez que el contenido interno cambia de largo. */
    .overlay{position:fixed;left:24px;bottom:24px;width:430px;display:flex;align-items:center;gap:15px;padding:14px 18px 14px 14px;border:1px solid rgba(244,182,58,.7);border-radius:16px;background:linear-gradient(120deg,rgba(12,15,10,.94),rgba(30,38,22,.9));box-shadow:0 12px 36px rgba(0,0,0,.45);transition:border-color .5s ease,box-shadow .5s ease}
    .overlay.is-discord{border-color:rgba(88,101,242,.85);box-shadow:0 12px 36px rgba(0,0,0,.45),0 0 22px rgba(88,101,242,.35)}
    .overlay.is-discord .ip{color:#7d89ff}
    img{width:76px;height:auto;flex:none;filter:drop-shadow(0 5px 8px #000)}
    .slidebox{min-width:0;transition:opacity .5s ease,transform .5s ease}
    .slidebox.is-fading{opacity:0;transform:translateY(6px)}
    .kicker{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:#9db089;font-weight:800;white-space:nowrap}.ip{font-size:22px;font-weight:900;color:#f4b63a;text-shadow:0 2px 0 #241a00;white-space:nowrap}.meta{display:flex;gap:10px;margin-top:3px;color:#dbe8ce;font-size:12px}.online{color:#7ec241;font-weight:800}.dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:#7ec241;box-shadow:0 0 8px #7ec241;margin-right:5px}
    @media(max-width:520px){.overlay{left:12px;bottom:12px;width:300px;padding:10px 13px}.ip{font-size:17px}img{width:58px}}
  </style>
</head>
<body>
  <div class="overlay" id="overlay">
    <img src="logo.png" alt="SillaMC" />
    <div style="min-width:0;flex:1">
      <div class="slidebox" id="slidebox"><div class="kicker" id="kicker">Juega con nosotros · Java + Bedrock</div><div class="ip" id="ip">sillamc.ddns.net</div></div>
      <div class="meta"><span class="online"><i class="dot"></i><span id="players">SillaMC online</span></span><span>Bedrock 19132</span></div>
    </div>
  </div>
  <script>
    async function refresh(){try{const r=await fetch('https://api.mcstatus.io/v2/status/java/sillamc.ddns.net',{cache:'no-store'});if(!r.ok)return;const d=await r.json();const n=d.players?.online;if(d.online&&Number.isFinite(Number(n)))document.getElementById('players').textContent=`${n} jugador${Number(n)===1?'':'es'} online`;}catch{}}
    refresh();setInterval(refresh,15000);

    // Alterna entre la IP del server y el Discord cada 10s, con un fundido corto
    // para que el cambio se note pero el cartel nunca cambie de tamaño por fuera.
    const SLIDES=[
      {kicker:'Juega con nosotros · Java + Bedrock',text:'sillamc.ddns.net',discord:false},
      {kicker:'Únete a la comunidad',text:'discord.gg/aTeaB9yQkJ',discord:true}
    ];
    let slideIdx=0;
    const overlay=document.getElementById('overlay'),box=document.getElementById('slidebox'),kickerEl=document.getElementById('kicker'),ipEl=document.getElementById('ip');
    setInterval(()=>{
      box.classList.add('is-fading');
      setTimeout(()=>{
        slideIdx=(slideIdx+1)%SLIDES.length;
        kickerEl.textContent=SLIDES[slideIdx].kicker;
        ipEl.textContent=SLIDES[slideIdx].text;
        overlay.classList.toggle('is-discord',SLIDES[slideIdx].discord);
        box.classList.remove('is-fading');
      },500);
    },10000);
  </script>
</body>
</html>
