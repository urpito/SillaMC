name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      # El repositorio guarda la web completa con su historial, pero GitHub Pages
      # solo publica una redirección: la web de verdad vive en https://sillamc.es.
      - name: Upload redirect
        uses: actions/upload-pages-artifact@v3
        with:
          path: "pages-redirect"
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
