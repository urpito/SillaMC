# Panel de correo de SillaMC en 127.0.0.1:8795.
# Hereda el allow/deny del server (solo red local y WireGuard) y además pide contraseña:
# desde aquí se crean buzones y se cambian contraseñas.
location = /correo {
    return 301 /correo/;
}

location ^~ /correo/ {
    auth_basic "Correo SillaMC";
    auth_basic_user_file /etc/nginx/correo.htpasswd;
    proxy_pass http://127.0.0.1:8795/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    add_header X-Robots-Tag "noindex, nofollow" always;
}
