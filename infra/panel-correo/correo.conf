# Panel de correo de SillaMC en 127.0.0.1:8795, versión de la red de casa.
# Hereda el allow/deny del server (solo red local y WireGuard). El acceso
# (código + 2FA) lo pide el propio panel; el primer emparejamiento solo se
# permite desde aquí.
location = /correo {
    return 301 /correo/;
}

location ^~ /correo/ {
    proxy_pass http://127.0.0.1:8795/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    add_header X-Robots-Tag "noindex, nofollow" always;
}
