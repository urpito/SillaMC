# Panel de correo publicado en https://mail.sillamc.es/cuentas/ (incluido en el
# server de mail.sillamc.es). Protegido por código de acceso + 2FA en el panel,
# y aquí con un límite de peticiones por IP.
location = /cuentas { return 301 /cuentas/; }

location ^~ /cuentas/ {
    limit_req zone=cuentas burst=20 nodelay;
    proxy_pass http://127.0.0.1:8795/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header Strict-Transport-Security "max-age=31536000" always;
}
